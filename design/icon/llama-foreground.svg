<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <!-- Adaptive icon foreground: 108x108 canvas, artwork kept inside the 66 unit safe circle. -->
  <defs>
    <radialGradient id="fur" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F3E6CF"/>
    </radialGradient>
    <linearGradient id="earIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F7A8B8"/>
      <stop offset="1" stop-color="#FBC9D3"/>
    </linearGradient>
  </defs>

  <!-- scaled to keep the ears inside the adaptive icon safe zone -->
  <g transform="translate(54 60) scale(0.8) translate(-54 -60)">
  <!-- long fluffy neck, drawn first so the head sits on top -->
  <path d="M43 76 C42 90 39 104 36 126 L72 126 C69 104 66 90 65 76 Z"
        fill="url(#fur)" stroke="#5B4636" stroke-width="1.6" stroke-linejoin="round"/>
  <g fill="none" stroke="#E6D3B3" stroke-width="1.3" stroke-linecap="round">
    <path d="M46 92 q2 -2 4 0"/>
    <path d="M57 97 q2 -2 4 0"/>
    <path d="M48 103 q2 -2 4 0"/>
  </g>

  <!-- ears -->
  <g stroke="#5B4636" stroke-width="1.6" stroke-linejoin="round">
    <path d="M37 47 C31 38 30 27 34 19 C39 22 44 31 45 43 Z" fill="url(#fur)"/>
    <path d="M71 47 C77 38 78 27 74 19 C69 22 64 31 63 43 Z" fill="url(#fur)"/>
  </g>
  <path d="M38 43 C35 36 35 29 36.5 24 C39.5 27 42 33 42.5 41 Z" fill="url(#earIn)"/>
  <path d="M70 43 C73 36 73 29 71.5 24 C68.5 27 66 33 65.5 41 Z" fill="url(#earIn)"/>

  <!-- head: one big round fluffy shape -->
  <path d="M54 37
           C68 37 79 46 79 59
           C79 74 68 85 54 85
           C40 85 29 74 29 59
           C29 46 40 37 54 37 Z"
        fill="url(#fur)" stroke="#5B4636" stroke-width="1.6"/>

  <!-- fluffy tuft on top -->
  <g fill="#FFFDF7" stroke="#5B4636" stroke-width="1.6">
    <circle cx="46" cy="40" r="6"/>
    <circle cx="62" cy="40" r="6"/>
    <circle cx="54" cy="35.5" r="7"/>
    <circle cx="50" cy="44" r="5"/>
    <circle cx="58" cy="44" r="5"/>
  </g>
  <!-- cover the inner strokes so the tuft reads as one puff -->
  <g fill="#FFFDF7">
    <circle cx="46" cy="40.6" r="4.9"/>
    <circle cx="62" cy="40.6" r="4.9"/>
    <circle cx="54" cy="36.4" r="5.9"/>
    <circle cx="50" cy="44" r="4"/>
    <circle cx="58" cy="44" r="4"/>
    <rect x="47" y="38" width="14" height="9" rx="4"/>
  </g>

  <!-- muzzle -->
  <ellipse cx="54" cy="72" rx="13" ry="9.5" fill="#FFF6E8" stroke="#5B4636" stroke-width="1.2" stroke-opacity="0.35"/>

  <!-- big sparkly eyes -->
  <g>
    <ellipse cx="43" cy="60" rx="5.2" ry="6.2" fill="#2E2219"/>
    <ellipse cx="65" cy="60" rx="5.2" ry="6.2" fill="#2E2219"/>
    <circle cx="44.8" cy="57.6" r="2.1" fill="#FFFFFF"/>
    <circle cx="66.8" cy="57.6" r="2.1" fill="#FFFFFF"/>
    <circle cx="41.4" cy="62.8" r="1" fill="#FFFFFF"/>
    <circle cx="63.4" cy="62.8" r="1" fill="#FFFFFF"/>
  </g>
  <!-- little raised brows for the surprised look -->
  <g stroke="#5B4636" stroke-width="1.4" stroke-linecap="round" fill="none">
    <path d="M39.5 50.5 Q43 48.5 46.5 50"/>
    <path d="M61.5 50 Q65 48.5 68.5 50.5"/>
  </g>

  <!-- rosy cheeks -->
  <ellipse cx="36.5" cy="69" rx="4.2" ry="2.6" fill="#F7A8B8" opacity="0.75"/>
  <ellipse cx="71.5" cy="69" rx="4.2" ry="2.6" fill="#F7A8B8" opacity="0.75"/>

  <!-- nose -->
  <path d="M51 67.5 Q54 69.5 57 67.5" stroke="#5B4636" stroke-width="1.4" fill="none" stroke-linecap="round"/>

  <!-- the "o" mouth -->
  <ellipse cx="54" cy="75.5" rx="3.6" ry="4.2" fill="#6B3A3A" stroke="#4A2C22" stroke-width="1.2"/>
  <ellipse cx="54" cy="77.3" rx="2.2" ry="1.6" fill="#F28CA0"/>
  </g>
</svg>
